name: CI

on:
  push:
    # A release tag points at a commit the branch push already verified, and publish-image.yml
    # runs its own gates on tags, so a tag run here only duplicates work.
    # Naming only tags-ignore would stop branch pushes from triggering at all, so branches are explicit.
    branches:
      - '**'
    tags-ignore:
      - '**'

# A newer push to the same branch supersedes the older run. The default branch is never cancelled,
# because release-train.py needs a finished successful run for its head commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  unit-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          
      # Keyed by the lockfile and the Node version; on a hit `npm ci` (about 50 s) is skipped.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Lint source and tests
        run: npm run lint

      - name: Verify generated API types match the backend snapshot
        run: |
          npm run api:generate
          git diff --exit-code -- src/types/generated

      - name: Build the application
        run: npm run build
        
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      - uses: docker/setup-buildx-action@v4.4.1

      # Lets the `docker buildx build` call below use the GitHub Actions cache (type=gha).
      - name: Expose the Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@v4.0.0

      # node_modules and the Playwright browsers depend only on the lockfile and the Node version.
      # On a hit `npm ci` (about a minute while the image builds) and the browser download are skipped.
      - name: Restore node_modules and the Playwright browsers
        id: toolchain
        uses: actions/cache@v6.1.0
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: e2e-toolchain-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      # The stack (image pulls plus the frontend image build) and the host toolchain are independent,
      # so they run side by side. The frontend image is built with a layer cache: its `npm ci` layer
      # changes only with package*.json. Shard 1 writes the cache; a branch reads its own or main's.
      # Any failure fails the step.
      - name: Start the stack and install the test toolchain in parallel
        env:
          TOOLCHAIN_CACHED: ${{ steps.toolchain.outputs.cache-hit }}
          WRITE_IMAGE_CACHE: ${{ matrix.shard == 1 }}
        run: |
          docker compose pull --quiet --ignore-buildable > "$RUNNER_TEMP/compose-pull.log" 2>&1 &
          pull_pid=$!
          cache_to=()
          if [ "$WRITE_IMAGE_CACHE" = "true" ]; then
            cache_to=(--cache-to "type=gha,mode=max,scope=frontend-e2e")
          fi
          docker buildx build --load --tag vite-react-frontend:local \
            --build-arg VITE_WAREHOUSE_ENABLED=true \
            --cache-from type=gha,scope=frontend-e2e "${cache_to[@]}" . > "$RUNNER_TEMP/image-build.log" 2>&1 &
          build_pid=$!
          if [ "$TOOLCHAIN_CACHED" = "true" ]; then
            npx playwright install-deps chromium &
          else
            (npm ci && npx playwright install chromium --with-deps) &
          fi
          toolchain_pid=$!
          status=0
          wait "$toolchain_pid" || status=1
          wait "$pull_pid" || status=1
          wait "$build_pid" || status=1
          for log in compose-pull image-build; do
            echo "::group::$log"
            cat "$RUNNER_TEMP/$log.log"
            echo "::endgroup::"
          done
          [ "$status" -eq 0 ] || exit 1
          docker compose up -d --no-build

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/wait-for-backend.sh
          chmod +x ./scripts/wait-for-frontend.sh
        
      - name: Wait for backend
        run: ./scripts/wait-for-backend.sh

      - name: Verify pinned backend matches the API snapshot
        if: matrix.shard == 1
        run: npm run api:check

      - name: Wait for frontend
        run: ./scripts/wait-for-frontend.sh
        
      - name: Run Playwright tests (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      # The two extra suites go on different shards: shard 2 is the slowest main slice, so shard 1
      # takes WebMCP and shard 3 takes the commerce journeys to even the three jobs out.
      - name: Verify REST and GraphQL commerce journeys
        if: matrix.shard == 3
        run: npm run test:e2e:commerce

      - name: Verify native WebMCP and shared shop state
        if: matrix.shard == 1
        run: npm run test:e2e:webmcp
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 1
