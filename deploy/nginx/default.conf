server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /branding/ {
    try_files $uri =404;
  }

  # Vite puts a content hash in every file name under /assets/, so a file never changes and can be
  # cached for a year. A missing hash must be a 404: falling back to index.html would answer a
  # script request from an old index.html with HTML and leave the user on a blank page. The header
  # is deliberately sent without `always`, so the 404 itself is not cached for a year (during a
  # rolling release an asset can be missing on one instance and present on the next).
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html names the current asset hashes, so the browser must revalidate it on every load
  # instead of caching it heuristically across a release. "/" and the SPA fallback below are
  # internal redirects to this location, so they get the same header.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
