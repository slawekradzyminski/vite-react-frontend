name: Publish container image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image tag, for example 3.8.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/slawekradzyminski/frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ">=24.22.1 <25"
          check-latest: true
          cache: npm

      - name: Validate release source and version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "The release commit must belong to $DEFAULT_BRANCH." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep --extended-regexp --quiet '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "Version must look like 3.8.0 or 3.8.0-rc.1." >&2
            exit 1
          fi

          PACKAGE_VERSION=$(node --print "require('./package.json').version")
          case "$VERSION" in
            "$PACKAGE_VERSION"|"$PACKAGE_VERSION"-*) ;;
            *)
              echo "Release $VERSION does not match package version $PACKAGE_VERSION." >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # A tag push releases a squash-merge commit whose git tree is identical to a PR head that already
  # passed the CI workflow. When any successful CI run tested that exact tree, re-running the same
  # tests here only delays the release. Manual prereleases and unmatched trees stay fully verified.
  check-prior-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - name: Look for a successful CI run on the same git tree
        id: lookup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_WORKFLOW: ci.yml
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          verified=false
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Manual prerelease: running the full verification."
          elif ! tree=$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" --jq .tree.sha) || [ -z "$tree" ]; then
            echo "::warning::Could not read the tree of $GITHUB_SHA; running the full verification."
          elif ! runs=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?status=success&per_page=100" \
              --jq '.workflow_runs[] | "\(.head_sha) \(.html_url)"'); then
            echo "::warning::Could not list successful $CI_WORKFLOW runs; running the full verification."
          else
            echo "Release commit $GITHUB_SHA has tree $tree."
            while read -r sha url; do
              [ -n "$sha" ] || continue
              if [ "$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha 2>/dev/null)" = "$tree" ]; then
                echo "Tree $tree already passed $CI_WORKFLOW on $sha: $url"
                echo "Verification skipped: tree \`$tree\` already passed $CI_WORKFLOW in $url" >> "$GITHUB_STEP_SUMMARY"
                verified=true
                break
              fi
            done < <(awk '!seen[$1]++' <<< "$runs")
            [ "$verified" = true ] || echo "No successful $CI_WORKFLOW run tested tree $tree; running the full verification."
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  verify:
    needs: [validate, check-prior-verification]
    if: needs.check-prior-verification.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ">=24.22.1 <25"
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e-tests:
    needs: [validate, check-prior-verification]
    if: needs.check-prior-verification.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Start the browser-test stack
        run: docker compose up --detach

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ">=24.22.1 <25"
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Make readiness scripts executable
        run: chmod +x scripts/wait-for-backend.sh scripts/wait-for-frontend.sh

      - name: Wait for the browser-test stack
        run: |
          ./scripts/wait-for-backend.sh
          ./scripts/wait-for-frontend.sh

      - name: Run Playwright tests (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Verify REST and GraphQL commerce journeys
        if: matrix.shard == 1
        run: npm run test:e2e:commerce

      - name: Verify native WebMCP and shared shop state
        if: matrix.shard == 1
        run: npm run test:e2e:webmcp

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Stop the browser-test stack
        if: always()
        run: docker compose down --volumes

  publish:
    needs: [validate, check-prior-verification, verify, e2e-tests]
    # verify and e2e-tests are skipped when the same tree already passed ci.yml. !cancelled() lets this
    # job start despite those skips; a failed, cancelled or otherwise skipped verification still blocks.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.check-prior-verification.result == 'success' &&
      (needs.check-prior-verification.outputs.verified == 'true' || (
        needs.verify.result == 'success' &&
        needs.e2e-tests.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required to publish." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      # Runs on both paths: ci.yml only builds the image with E2E build arguments, never the published
      # configuration. The amd64 layers stay in this builder's cache, so the push below reuses them.
      - name: Build the amd64 runtime image for the smoke test
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: frontend:release-candidate
          cache-from: type=gha

      - name: Smoke-test the runtime image
        run: |
          docker run --detach --name frontend-release-candidate --publish 127.0.0.1:8084:80 frontend:release-candidate
          trap 'docker rm --force frontend-release-candidate' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8084/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs frontend-release-candidate
              exit 1
            fi
            sleep 1
          done
          test "$(curl --fail --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8084/login)" = "200"

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record published digest
        run: echo "Published digest \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
