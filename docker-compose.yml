services:
  backend:
    # Release train pin, same digest as awesome-localstack's lightweight-docker-compose.yml.
    # openapi/backend-api-docs.json is this image's document (BACKEND_IMAGE overrides it).
    image: ${BACKEND_IMAGE:-slawekradzyminski/backend:3.21.1@sha256:872f6c143a7165d87b17da599a9ae9a31ffe7a6a2b1fb9b3124cb1db3bc78d73}
    expose:
      - "4001"
    hostname: backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PASSWORD_RESET_FRONTEND_BASE_URL: http://localhost:8081/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: http://localhost:8081/swagger-ui/oauth2-redirect.html
      OLLAMA_BASE_URL: http://ollama-mock:11434
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:8081,http://127.0.0.1:8081
      # warehouse-service and payment-service verify access tokens with the backend JWKS
      # and call its internal API with these service tokens. The backend calls payment-service
      # (refunds) with the payment token and verifies payment results with the webhook secret.
      WAREHOUSE_SERVICE_TOKEN: ci-warehouse-service-token
      PAYMENT_SERVICE_TOKEN: ci-payment-service-token
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
      PAYMENT_BASE_URL: http://payment-service:4004
      # notification-service (backend 3.21.0+) reads the event feed with its own token, sends the
      # commerce emails and owns user webhooks: the backend records notification.requested feed
      # events instead of sending those emails and runs no webhook dispatcher of its own.
      NOTIFICATION_SERVICE_TOKEN: ci-notification-service-token
      NOTIFICATIONS_DELIVERY: feed
      WEBHOOKS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-mock:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4001;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - my-private-ntwk

  warehouse-service:
    # Shipments, simulated carrier tracking, returns and purchasing. Release train pin; its document
    # is openapi/warehouse-api-docs.json (WAREHOUSE_IMAGE overrides it).
    image: ${WAREHOUSE_IMAGE:-slawekradzyminski/warehouse-service:1.5.1@sha256:17adbb3cc45ed71bb522cae280e442f4af3690cb48a20627c6f04efdb6371a7e}
    expose:
      - "4003"
    hostname: warehouse-service
    environment:
      # Shares the backend database (schema warehouse); demo seeds the training suppliers.
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=warehouse
      SPRING_DATASOURCE_USERNAME: warehouse
      SPRING_DATASOURCE_PASSWORD: ci-warehouse-db-password
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      BACKEND_BASE_URL: http://backend:4001
      WAREHOUSE_SERVICE_TOKEN: ci-warehouse-service-token
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    networks:
      - my-private-ntwk

  payment-service:
    # Card payments with test cards and 3-D Secure. Release train pin; its document is
    # openapi/payment-api-docs.json (PAYMENT_IMAGE overrides it).
    image: ${PAYMENT_IMAGE:-slawekradzyminski/payment-service:1.3.1@sha256:a82b2da62b18514a27039c716ac6d6b49a6ed804f58a739a8812f49cd91bc5b8}
    expose:
      - "4004"
    hostname: payment-service
    environment:
      # Shares the backend database (schema payment).
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=payment
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: ci-payment-db-password
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      BACKEND_BASE_URL: http://backend:4001
      PAYMENT_SERVICE_TOKEN: ci-payment-service-token
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    networks:
      - my-private-ntwk

  notification-service:
    # Webhooks, webhook inboxes and commerce emails, fed by the backend event feed. Its document is
    # openapi/notification-api-docs.json (NOTIFICATION_IMAGE overrides it).
    image: ${NOTIFICATION_IMAGE:-slawekradzyminski/notification-service:1.0.1@sha256:1a051e8aa54e90f5e9dd9d8dbd1aacd94b1af6f886ea571a0f4d7cac23019c52}
    expose:
      - "4005"
    hostname: notification-service
    environment:
      # Shares the backend database (schema notification); emails stay in its in-memory outbox.
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: ci-notification-db-password
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      BACKEND_BASE_URL: http://backend:4001
      NOTIFICATION_SERVICE_TOKEN: ci-notification-service-token
      NOTIFICATION_EMAIL_TRANSPORT: local-outbox
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    networks:
      - my-private-ntwk

  postgres-roles:
    # One-shot: gives warehouse-service, payment-service and notification-service their own roles, each limited to
    # its own schema (deploy/postgres/service-roles.sh, copied from awesome-localstack).
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    entrypoint: ["bash", "/scripts/service-roles.sh"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: testdb
      PGUSER: postgres
      PGPASSWORD: postgres
      WAREHOUSE_DB_PASSWORD: ci-warehouse-db-password
      PAYMENT_DB_PASSWORD: ci-payment-db-password
      NOTIFICATION_DB_PASSWORD: ci-notification-db-password
    volumes:
      - ./deploy/postgres:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - my-private-ntwk

  postgres:
    # Disposable database for the backend's local profile (PostgreSQL with Flyway since backend 3.12.0),
    # warehouse-service (schema warehouse), payment-service (schema payment) and
    # notification-service (schema notification).
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - my-private-ntwk

  frontend:
    image: ${FRONTEND_IMAGE:-vite-react-frontend:local}
    build:
      context: .
      args:
        # The E2E suite covers warehouse-service screens (public tracking, order delivery and
        # carrier timeline), so this build keeps them on.
        VITE_WAREHOUSE_ENABLED: "true"
    expose:
      - "80"
    hostname: frontend
    networks:
      - my-private-ntwk

  gateway:
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    depends_on:
      - frontend
      - backend
    ports:
      # GATEWAY_PORT lets an isolated stack run beside another one (APP_BASE_URL follows it).
      - "${GATEWAY_PORT:-8081}:80"
    volumes:
      - ./deploy/nginx/app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - my-private-ntwk

  ollama-mock:
    image: slawekradzyminski/ollama-mock:1.0.13@sha256:7e3ea7b3c6774c38e81726e64e47323159cea53ce5777ab35754a0e5a9b4ef5e
    restart: always
    ports:
      - "${OLLAMA_MOCK_PORT:-11434}:11434"
    networks:
      - my-private-ntwk
networks:
  my-private-ntwk:
    driver: bridge
