name: CI

on:
  push:
    # A release tag points at a commit the branch push already verified, and publish-image.yml
    # runs its own gates on tags, so a tag run here only duplicates work.
    # Naming only tags-ignore would stop branch pushes from triggering at all, so branches are explicit.
    branches:
      - '**'
    tags-ignore:
      - '**'

# A newer push to the same branch supersedes the older run. The default branch is never cancelled,
# because release-train.py needs a finished successful run for its head commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  unit-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm run test

      - name: Lint source and tests
        run: npm run lint

      - name: Verify generated API types match the backend snapshot
        run: |
          npm run api:generate
          git diff --exit-code -- src/types/generated

      - name: Build the application
        run: npm run build
        
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      # The stack start (image pulls plus the frontend image build, 85-110 s) and the host toolchain
      # (npm ci plus the Playwright browser, 45-90 s) are independent, so run them side by side
      # instead of one after the other. Either failure fails the step.
      - name: Start the stack and install the test toolchain in parallel
        run: |
          docker compose up -d > "$RUNNER_TEMP/compose-up.log" 2>&1 &
          compose_pid=$!
          (npm ci && npx playwright install chromium --with-deps) &
          toolchain_pid=$!
          status=0
          wait "$toolchain_pid" || status=1
          wait "$compose_pid" || status=1
          echo "::group::docker compose up"
          cat "$RUNNER_TEMP/compose-up.log"
          echo "::endgroup::"
          exit "$status"

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/wait-for-backend.sh
          chmod +x ./scripts/wait-for-frontend.sh
        
      - name: Wait for backend
        run: ./scripts/wait-for-backend.sh

      - name: Verify pinned backend matches the API snapshot
        if: matrix.shard == 1
        run: npm run api:check

      - name: Wait for frontend
        run: ./scripts/wait-for-frontend.sh
        
      - name: Run Playwright tests (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      # The two extra suites go on different shards: shard 2 is the slowest main slice, so shard 1
      # takes WebMCP and shard 3 takes the commerce journeys to even the three jobs out.
      - name: Verify REST and GraphQL commerce journeys
        if: matrix.shard == 3
        run: npm run test:e2e:commerce

      - name: Verify native WebMCP and shared shop state
        if: matrix.shard == 1
        run: npm run test:e2e:webmcp
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 1
