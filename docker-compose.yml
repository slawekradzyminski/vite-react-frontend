services:
  backend:
    image: ${BACKEND_IMAGE:-slawekradzyminski/backend:3.7.14@sha256:dd310697d66c389eab971adb8cbb07cf00fc17d824f4775b99e8dbdce7271ad7}
    expose:
      - "4001"
    hostname: backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      PASSWORD_RESET_FRONTEND_BASE_URL: http://localhost:8081/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: http://localhost:8081/swagger-ui/oauth2-redirect.html
      OLLAMA_BASE_URL: http://ollama-mock:11434
      APP_SSO_ENABLED: "true"
      APP_SSO_ISSUER_URI: http://localhost:8082/realms/awesome-testing
      APP_SSO_JWK_SET_URI: http://keycloak:8080/realms/awesome-testing/protocol/openid-connect/certs
      APP_SSO_AUDIENCE: awesome-testing-frontend
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:8081,http://127.0.0.1:8081
    depends_on:
      - keycloak
      - ollama-mock
    networks:
      - my-private-ntwk

  frontend:
    image: ${FRONTEND_IMAGE:-vite-react-frontend:local}
    build:
      context: .
    expose:
      - "80"
    hostname: frontend
    networks:
      - my-private-ntwk

  gateway:
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    depends_on:
      - frontend
      - backend
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx/app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - my-private-ntwk

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    restart: always
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - my-private-ntwk
  ollama-mock:
    image: slawekradzyminski/ollama-mock:1.0.8@sha256:9859266fbd274ae3030d3b191fe795de76710c0019ee4c33913658cffc7e712e
    restart: always
    ports:
      - "11434:11434"
    networks:
      - my-private-ntwk
networks:
  my-private-ntwk:
    driver: bridge
